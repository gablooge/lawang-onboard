# Synthetic demo roles. A role sees an item only if it holds ALL of the item's scopes.
# Tokens are NOT here: each role's token comes from the environment variable named below.

scopes:
  # path globs -> scope. First match wins. A path with no match gets no scope and is denied.
  - glob: "growth/**"
    scope: "private:growth"
  - glob: "SECURITY.md"
    scope: "private:security"
  - glob: "docs/adr/**"
    scope: "adr:public"
  - glob: "docs/**"
    scope: "docs:public"
  - glob: "README.md"
    scope: "docs:public"
  - glob: "internal/ingress/**"
    scope: "path:internal/ingress"
  - glob: "internal/provider/**"
    scope: "path:internal/provider"
  - glob: "internal/**"
    scope: "path:internal/core"
  - glob: "cmd/**"
    scope: "path:cmd"
  - glob: "migrations/**"
    scope: "path:migrations"
  - glob: "Makefile"
    scope: "setup:public"
  - glob: ".github/**"
    scope: "setup:public"
  - glob: "go.mod"
    scope: "setup:public"
  - glob: ".golangci.yml"
    scope: "setup:public"
  - glob: "sqlc.yaml"
    scope: "setup:public"
  - glob: "**"
    scope: "path:repo"

# Items with no paths (issues, issue comments) get their scope from labels, then from kind.
# A label rule wins over the kind rule. An issue comment carries its issue's labels.
label_scopes:
  growth: "private:growth"

kind_scopes:
  issue: "backlog:public"
  issue_comment: "backlog:public"

# label_areas maps a label to the path scope that represents it.
# starter_tasks uses this: an open issue is a starter task for a role when the role holds
# the area scope of at least one of the issue's labels.
label_areas:
  provider: "path:internal/provider"

roles:
  maintainer:
    token_env: ONBOARD_TOKEN_MAINTAINER
    scopes: ["*"]
  employee:
    token_env: ONBOARD_TOKEN_EMPLOYEE
    scopes: ["path:*", "docs:*", "adr:*", "backlog:*", "setup:*"]
  contractor:
    token_env: ONBOARD_TOKEN_CONTRACTOR
    scopes: ["path:internal/ingress", "path:internal/provider", "docs:public", "adr:public", "backlog:public", "setup:public"]
